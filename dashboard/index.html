<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahoraga Bot Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #14141a 0%, #08080a 60%);
    color: #eee;
    margin: 0;
    padding: 20px 16px 60px;
    min-height: 100vh;
  }
  .header { margin-bottom: 20px; }
  .header h1 {
    font-size: 1.5rem; margin: 0 0 4px 0;
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 800;
  }
  .updated { color: #6b7280; font-size: 0.78rem; }
  .card {
    background: linear-gradient(160deg, #1c1c22 0%, #151519 100%);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
    border: 1px solid #2a2a32;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .card-top h2 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot-ok { background: #34d399; box-shadow: 0 0 10px #34d399; animation: pulse 2s infinite; }
  .dot-error { background: #f87171; box-shadow: 0 0 10px #f87171; }
  .dot-missing { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; background: #2a2a32; color: #a1a1aa; }
  .pill-live { background: #451a1a; color: #f87171; }
  .pill-paper { background: #1a2e2a; color: #34d399; }

  .equity { font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; margin: 10px 0 2px; }
  .equity-label { font-size: 0.78rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }

  .chart-wrap { height: 90px; margin: 14px 0 6px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat { background: #101014; border-radius: 10px; padding: 10px 12px; }
  .stat-label { font-size: 0.72rem; color: #6b7280; margin-bottom: 3px; }
  .stat-value { font-size: 0.95rem; font-weight: 600; }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
  .badge-TRENDING, .badge-BULLISH { background: #1a2e2a; color: #34d399; }
  .badge-RANGING { background: #2a2416; color: #fbbf24; }
  .badge-VOLATILE, .badge-BEARISH { background: #2e1a1a; color: #f87171; }
  .badge-UNKNOWN, .badge-UNCERTAIN { background: #23232b; color: #a1a1aa; }

  .decision { margin-top: 14px; font-size: 0.85rem; color: #d1d5db; background: #101014; border-radius: 10px; padding: 10px 12px; }
  .error-text { color: #f87171; font-size: 0.85rem; margin-top: 10px; }
</style>
</head>
<body>
  <div class="header">
    <h1>⟁ Mahoraga</h1>
    <div class="updated" id="updated">Loading...</div>
  </div>
  <div id="accounts"></div>

  <script>
    const charts = {};

    function regimeClass(v) { return 'badge badge-' + (v || 'UNKNOWN'); }

    async function fetchJson(path) {
      try {
        const res = await fetch(path + '?_=' + Date.now());
        if (!res.ok) return null;
        return await res.json();
      } catch (e) { return null; }
    }

    async function load() {
      const dashboard = await fetchJson('./dashboard.json');
      const journal = (await fetchJson('./journal.json')) || [];

      if (!dashboard) {
        document.getElementById('updated').textContent = 'Waiting for first run...';
        return;
      }

      document.getElementById('updated').textContent =
        'Last update: ' + (dashboard.updated_at ? new Date(dashboard.updated_at).toLocaleString() : 'never');

      const container = document.getElementById('accounts');
      const accounts = dashboard.accounts || {};

      if (Object.keys(accounts).length === 0) {
        container.innerHTML = '<div class="card">No account data yet — waiting for first run.</div>';
        return;
      }

      container.innerHTML = '';
      for (const [id, info] of Object.entries(accounts)) {
        const dotClass = info.status === 'ok' ? 'dot-ok'
          : info.status === 'missing_credentials' ? 'dot-missing' : 'dot-error';
        const modeClass = info.mode === 'live' ? 'pill-live' : 'pill-paper';

        const equityHistory = journal
          .filter(e => e.account_id === id && e.equity)
          .slice(-40);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            <h2><span class="dot ${dotClass}"></span>${info.name || id}</h2>
            <span class="pill ${modeClass}">${(info.mode || '').toUpperCase()}</span>
          </div>
          <div class="equity-label">Total equity</div>
          <div class="equity">${info.equity ? '$' + Number(info.equity).toLocaleString(undefined, {maximumFractionDigits: 2}) : '—'}</div>
          <div class="chart-wrap"><canvas id="chart-${id}"></canvas></div>
        `;
        container.appendChild(card);

        const symbols = info.symbols || {};
        for (const [sym, s] of Object.entries(symbols)) {
          const row = document.createElement('div');
          row.className = 'grid';
          row.style.marginTop = '10px';
          row.innerHTML = `
            <div class="stat" style="grid-column: 1 / -1; margin-bottom: -4px;"><div class="stat-label">${sym}${s.leverage ? ' · ' + s.leverage + 'x' : ''}</div></div>
            <div class="stat"><div class="stat-label">Regime</div><div class="stat-value"><span class="${regimeClass(s.regime)}">${s.regime || '—'}</span></div></div>
            <div class="stat"><div class="stat-label">Trend</div><div class="stat-value"><span class="${regimeClass(s.trend)}">${s.trend || '—'}</span></div></div>
          `;
          card.appendChild(row);
          if (s.last_decision) {
            const dec = document.createElement('div');
            dec.className = 'decision';
            dec.textContent = s.last_decision;
            card.appendChild(dec);
          }
          if (s.error) {
            const err = document.createElement('div');
            err.className = 'error-text';
            err.textContent = s.error;
            card.appendChild(err);
          }
        }
        if (info.error) {
          const err = document.createElement('div');
          err.className = 'error-text';
          err.textContent = info.error;
          card.appendChild(err);
        }

        if (equityHistory.length > 1) {
          const ctx = card.querySelector(`#chart-${id}`).getContext('2d');
          if (charts[id]) charts[id].destroy();
          charts[id] = new Chart(ctx, {
            type: 'line',
            data: {
              labels: equityHistory.map(e => e.timestamp),
              datasets: [{
                data: equityHistory.map(e => parseFloat(e.equity)),
                borderColor: '#a78bfa',
                backgroundColor: 'rgba(167,139,250,0.15)',
                fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2,
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { x: { display: false }, y: { display: false } },
            }
          });
        }
      }
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
